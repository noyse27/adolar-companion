name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff==0.16.0 Pillow
      - name: Lint
        run: python -m ruff check .
      - name: Compile check
        run: python -m py_compile adolar_radio.py make_icon.py
      - name: Build executable
        run: python -m PyInstaller adolar_radio.spec --clean --noconfirm
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: AdolarRadio-windows
          path: dist/AdolarRadio.exe
          if-no-files-found: error
